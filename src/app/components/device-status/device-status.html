<div class="device-grid">
  <div class="device-card" *ngFor="let device of devices" [ngClass]="getCardClass(device.health)">
    <div class="device-top">
      <div class="device-top">
        <h3>{{ device.name }}</h3>
        <span class="dot"></span>
      </div>
      <p>{{ device.status }}</p>
    </div>
  </div>
</div>
